# Compilation croisée de l'exécutable Windows depuis Linux :
#   rustup target add x86_64-pc-windows-gnu
#   sudo apt install gcc-mingw-w64-x86-64
#   cargo build --release -p gestion-csv-bureau --target x86_64-pc-windows-gnu
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
rustflags = ["-C", "target-feature=+crt-static"]

# Exécutable Windows autonome avec le compilateur Microsoft (MSVC) :
# pas besoin d'installer les bibliothèques Visual C++ sur le poste.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
