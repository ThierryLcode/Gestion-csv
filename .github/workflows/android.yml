# Application Android « Projection retraites » (dossier retraites/) :
#  - teste le modèle de projection et compile l'APK à chaque envoi touchant retraites/ ;
#  - l'APK est téléchargeable dans l'onglet Actions (artefact « ProjectionRetraites-apk ») ;
#  - il est aussi publié dans une version GitHub retraites-v<versionName> (lien direct pour le téléphone).
name: Application Android

on:
  push:
    branches: ["**"]
    paths:
      - "retraites/**"
      - ".github/workflows/android.yml"
    tags: ["retraites-v*"]
  pull_request:
    paths:
      - "retraites/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: retraites
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests du modèle
        run: ./gradlew --no-daemon :modele:test

      - name: Compilation de l'APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Préparation du livrable
        run: |
          mkdir -p livrable
          cp app/build/outputs/apk/release/app-release.apk livrable/ProjectionRetraites.apk
          sha256sum livrable/ProjectionRetraites.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ProjectionRetraites-apk
          path: retraites/livrable/ProjectionRetraites.apk

      # Publication d'une version GitHub avec l'APK, sur chaque envoi (hors pull request) :
      # étiquette retraites-v<versionName> créée par GitHub ; si elle existe déjà, l'APK est remplacé.
      # Lien stable : https://github.com/<dépôt>/releases/latest/download/ProjectionRetraites.apk
      - name: Publication de la version
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          tag="retraites-v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" livrable/ProjectionRetraites.apk --clobber
          else
            gh release create "$tag" livrable/ProjectionRetraites.apk --target "$GITHUB_SHA" \
              --title "Projection retraites $version" \
              --notes "APK Android de l'application Projection retraites (hypothèses COR juin 2026), développée par Thierry LORGEOU. Ouvrez ce lien depuis le téléphone, téléchargez ProjectionRetraites.apk puis installez-le."
          fi
