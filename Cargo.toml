[package]
name = "gestion-csv"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
csv = "1.4.0"
encoding_rs = "0.8.44"
encoding_rs_io = "0.1.8"
regex = "1.13.1"
rusqlite = { version = "0.43.0", features = ["bundled", "functions"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
uuid = { version = "1.29.2", features = ["v4"] }
zip = { version = "9.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
